[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-insight-platform"
version = "0.1.5"
description = "Local evidence-based research workspace with immutable, portable deliveries"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  "httpx>=0.28,<0.29",
  "jinja2>=3.1,<4",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "beautifulsoup4>=4.13,<5",
  "trafilatura>=2,<3",
  "keyring>=25,<27",
  "youtube-transcript-api>=1.2,<2",
  "defusedxml>=0.7.1,<1",
  "requests>=2.34,<3",
]

[project.scripts]
insight = "insight.entrypoints.cli:main"

[project.optional-dependencies]
media = [
    "yt-dlp>=2026.8,<2027",
]
speech = [
    "faster-whisper>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
    "types-beautifulsoup4",
    "build>=1.2,<2",
    "types-requests>=2.33.0.20261006",
    "types-defusedxml>=0.7.0.20260504",
    "types-yt-dlp>=2026.8.19.20261008",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insight"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "insight/resources/migrations"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["insight"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: opt-in real network acquisition", "acceptance: design acceptance scenarios"]
